#
# ZachOS pacman.conf - based on Arch Linux's default, with the driver-hold
# list wired in so "Hold drivers" in Zach Center actually takes effect.
#
[options]
HoldPkg      = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel     = Required DatabaseOptional
LocalFileSigLevel = Optional
# Populated by `zach-driver-rollback --hold on`; empty otherwise. Must always
# exist - pacman errors out if an Include target is missing.
Include = /etc/pacman.d/zachos-hold.conf

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
