<svg width="3840" height="2160" viewBox="0 0 3840 2160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="redfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e31e24" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e31e24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#bg)"/>

  <!-- torn-edge red band, top right -->
  <polygon points="2650,0 3840,0 3840,900 3300,760 3050,880 2820,720 2900,540 2700,420"
           fill="url(#redfade)"/>

  <!-- faint oversized Z mark, bottom right, brand-inspired geometric monogram -->
  <g transform="translate(2560,1120)" opacity="0.10">
    <polygon points="0,0 760,0 760,160 260,160 760,760 760,920 0,920 0,760 500,760 0,160"
             fill="#e31e24"/>
    <rect x="300" y="330" width="160" height="260" fill="#050505"/>
  </g>

  <!-- thin accent rule -->
  <rect x="0" y="2073" width="3840" height="3" fill="#e31e24" opacity="0.55"/>

  <!-- wordmark -->
  <text x="96" y="2040" font-family="DejaVu Sans"
        font-size="46" font-weight="700" letter-spacing="14" fill="#f2f2f2">ZACH<tspan fill="#e31e24">OS</tspan></text>
  <text x="96" y="1990" font-family="DejaVu Sans"
        font-size="22" letter-spacing="6" fill="#8a8a8a">GAMING / STREAMING DESKTOP</text>
</svg>
